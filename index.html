<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- Home-screen / installed-app branding. "Tide · OFC" leads with "Tide" so it
         surfaces when searching the phone. apple-mobile-web-app-title sets the iOS
         home-screen label; the manifest sets it on Android/Chrome. -->
    <meta name="apple-mobile-web-app-title" content="Tide · OFC">
    <meta name="theme-color" content="#05204A">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <title>Tide · OFC</title>
    <style>
        body {
            font-family: Courier, monospace;
            background-color: #96ACB7;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #05204A;
        }
        .app-container {
            background-color: #E8EEF2;
            border-radius: 40px;
            box-shadow: 0 0 20px rgba(5, 32, 74, 0.2);
            width: 100%;
            max-width: 375px;
            height: 100vh;
            max-height: 812px;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .location { font-size: 24px; font-weight: bold; margin-top: env(safe-area-inset-top); }
        .subtitle { font-size: 12px; opacity: 0.7; margin-top: 2px; }
        .current-date { font-size: 18px; margin-top: 6px; margin-bottom: 20px; }
        .note { font-size: 11px; opacity: 0.65; }
        .tide-wave { width: 100%; margin: 8px 0 4px; line-height: 0; }
        .tide-wave svg { width: 100%; height: auto; display: block; }
        .data-section { width: 100%; margin-bottom: 20px; }
        .data-section h2 { font-size: 18px; margin: 0 0 10px; }
        .data-box {
            background-color: #FFFFFF;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            width: 100%;
            box-sizing: border-box;
        }
        .data-item { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .data-label { font-weight: bold; }
        .pill { display: inline-block; padding: 1px 7px; border-radius: 20px; font-size: 11px; font-weight: bold; white-space: nowrap; }
        .pill.up2 { background: #f2c9c0; color: #7a1f0c; }
        .pill.up1 { background: #f7e0d2; color: #8a4a2c; }
        .pill.mid { background: #d8e0e6; color: #3a4a57; }
        .pill.down1 { background: #dbe6f4; color: #2c4a7a; }
        .pill.down2 { background: #c0d6f2; color: #0c3a7a; }
        #loading, #error { text-align: center; font-size: 18px; }
        .landscape-time {
            display: none;
            font-size: 48px;
            font-weight: bold;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        @media (orientation: landscape) {
            body { background-color: #05204A; }
            .app-container {
                background-color: transparent;
                box-shadow: none;
            }
            .app-container > *:not(.landscape-time) { display: none; }
            .landscape-time { display: block; color: #E8EEF2; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="location">Old Field Club</div>
        <div class="subtitle">Estimated tide &middot; interpolated from Port Jefferson &amp; Northport</div>
        <div class="current-date" id="currentDate"></div>
        <div id="loading">Loading data...</div>
        <div id="error" style="display: none;"></div>
        <div id="tideInfo" class="data-section" style="display: none;">
            <h2>Tide Information</h2>
            <div class="data-box"></div>
        </div>
        <div id="waterTempInfo" class="data-section" style="display: none;">
            <h2>Water Temperature</h2>
            <div class="data-box"></div>
        </div>
        <div id="sunInfo" class="data-section" style="display: none;">
            <h2>Sun Information</h2>
            <div class="data-box"></div>
        </div>
        <div id="moonInfo" class="data-section" style="display: none;">
            <h2>Moon Information</h2>
            <div class="data-box"></div>
        </div>
        <div class="landscape-time" id="landscapeTime"></div>
    </div>

    <script>
        // Port Jefferson is in the US Eastern time zone. Anchoring everything to
        // this zone keeps the app accurate regardless of where it is viewed and
        // automatically follows the EST/EDT daylight-savings switch.
        const TIME_ZONE = 'America/New_York';

        // NOAA has no tide station at the Old Field Club (86 West Meadow Road, on
        // Smithtown Bay). We estimate its tide by linearly interpolating between the
        // two nearest reference stations that bracket it along the shore — Port
        // Jefferson to the east and Northport Bay to the west — by longitude. This
        // is a first-order estimate (the same idea NOAA's subordinate-station time/
        // height offsets encode), not an official prediction, hence "Estimated".
        const TARGET = { name: 'Old Field Club', lat: 40.943, lon: -73.146 };
        const EAST = { id: '8514560', name: 'Port Jefferson', lon: -73.0767 };
        const WEST = { id: '8515586', name: 'Northport', lon: -73.3533 };
        const TEMP_STATION = { id: '8467150', name: 'Bridgeport, CT' };

        // Blend weight toward the west anchor (0 = Port Jefferson, 1 = Northport),
        // from where the target sits between the two stations' longitudes (~0.25).
        const W = (TARGET.lon - EAST.lon) / (WEST.lon - EAST.lon);

        // Eastern Time's current UTC offset in whole hours (-5 during EST, -4
        // during EDT). Derived from the date so daylight savings is handled for us.
        function getEasternUtcOffset(date = new Date()) {
            const utcDate = new Date(date.toLocaleString('en-US', { timeZone: 'UTC' }));
            const easternDate = new Date(date.toLocaleString('en-US', { timeZone: TIME_ZONE }));
            return Math.round((easternDate - utcDate) / (1000 * 60 * 60));
        }

        // Calendar date (YYYY-MM-DD) as it is in Eastern Time, not UTC. Using UTC
        // here would roll over to "tomorrow" during the evening hours.
        function getEasternDateString(date = new Date()) {
            return date.toLocaleDateString('en-CA', { timeZone: TIME_ZONE });
        }

        // NOAA returns tide times as Eastern wall-clock strings ("YYYY-MM-DD HH:MM")
        // with no zone marker. Attach the correct Eastern offset so they parse to the
        // right instant even when the viewing device is in another time zone.
        function parseEasternDateTime(dateTimeString) {
            const [datePart, timePart] = dateTimeString.trim().split(/[ T]/);
            const offset = getEasternUtcOffset(new Date(`${datePart}T12:00:00Z`));
            const sign = offset >= 0 ? '+' : '-';
            const pad = String(Math.abs(offset)).padStart(2, '0');
            return new Date(`${datePart}T${timePart}:00${sign}${pad}:00`);
        }

        function getTodayDate() {
            return getEasternDateString();
        }

        function getTomorrowDate() {
            return getEasternDateString(new Date(Date.now() + 24 * 60 * 60 * 1000));
        }

        function getSunMoonApiUrl() {
            const tz = getEasternUtcOffset();
            return `https://aa.usno.navy.mil/api/rstt/oneday?date=${getTodayDate()}&coords=${TARGET.lat},${TARGET.lon}&tz=${tz}&dst=false`;
        }

        function getTideApiUrl(stationId) {
            const beginDate = getTodayDate().replace(/-/g, '');
            const endDate = getTomorrowDate().replace(/-/g, '');
            return `https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?product=predictions&application=NOS.COOPS.TAC.WL&begin_date=${beginDate}&end_date=${endDate}&datum=MLLW&station=${stationId}&time_zone=lst_ldt&units=english&interval=hilo&format=json`;
        }

        // Latest water-temperature observation. There is no sensor at the target;
        // the nearest reporting station is Bridgeport, CT across the Sound, so the
        // reading is labeled with its source rather than presented as local.
        function getWaterTempUrl(stationId) {
            return `https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?product=water_temperature&application=NOS.COOPS.TAC.WL&date=latest&station=${stationId}&time_zone=lst_ldt&units=english&format=json`;
        }

        // --- Today vs. typical comparison ------------------------------------

        function getDatumsApiUrl(stationId) {
            return `https://api.tidesandcurrents.noaa.gov/mdapi/prod/webapi/stations/${stationId}/datums.json`;
        }

        // A full year of high/low predictions, ending today, for the 12-month
        // percentile. Same URL shape as getTideApiUrl, just a wider date range.
        function getTideStatsApiUrl(stationId) {
            const beginDate = getEasternDateString(new Date(Date.now() - 365 * 24 * 60 * 60 * 1000)).replace(/-/g, '');
            const endDate = getTodayDate().replace(/-/g, '');
            return `https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?product=predictions&application=NOS.COOPS.TAC.WL&begin_date=${beginDate}&end_date=${endDate}&datum=MLLW&station=${stationId}&time_zone=lst_ldt&units=english&interval=hilo&format=json`;
        }

        // Small persistent cache (localStorage) with an in-memory fallback for
        // browsers that block storage, e.g. private mode. Values use JSON.
        const memoryCache = {};
        function cacheGet(key) {
            try {
                const raw = localStorage.getItem(key);
                if (raw !== null) return JSON.parse(raw);
            } catch (e) { /* storage unavailable */ }
            return key in memoryCache ? memoryCache[key] : null;
        }
        function cacheSet(key, value) {
            memoryCache[key] = value;
            try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* ignore */ }
        }

        // NOAA's published tidal datums (long-term averages and astronomical
        // extremes) only change once per ~19-year epoch, so they are cached for a
        // long time. They are reported on the station datum; we convert to the MLLW
        // reference the predictions use so they line up with predicted heights.
        async function getStationDatums(stationId) {
            const key = `tideDatums:${stationId}`;
            const cached = cacheGet(key);
            if (cached && (Date.now() - cached.fetchedAt) < 30 * 24 * 60 * 60 * 1000) {
                return cached.datums;
            }
            const data = await fetchData(getDatumsApiUrl(stationId));
            const byName = {};
            (data.datums || []).forEach(d => { byName[d.name] = parseFloat(d.value); });
            const mllw = byName.MLLW;
            if (!isFinite(mllw)) throw new Error('Datums missing MLLW');
            const toMllw = stnd => parseFloat(stnd) - mllw;
            const datums = {
                avgHigh: toMllw(byName.MHHW),   // mean higher-high water = average high tide
                avgLow: 0,                       // MLLW is the prediction baseline (average low tide)
                ceiling: toMllw(data.HAT),       // highest astronomical tide
                floor: toMllw(data.LAT)          // lowest astronomical tide
            };
            cacheSet(key, { fetchedAt: Date.now(), datums });
            return datums;
        }

        // Percentage of values in arr strictly less than value (0-100), or null.
        function percentileOf(value, arr) {
            if (!arr.length) return null;
            const below = arr.reduce((n, v) => n + (v < value ? 1 : 0), 0);
            return Math.round((below / arr.length) * 100);
        }

        // Classifies a tide height against the past year's distribution of that
        // tide type (and the astronomical extreme from the datums). Arrows track
        // the water level versus a normal tide of that type — both for highs and
        // lows — so a deep low reads ↓↓ and a barely-there low reads ↑↑. Colour
        // matches: blue = lower water, red = higher water.
        function classifyTide(value, arr, kind, datums) {
            const pct = percentileOf(value, arr);
            const nearTop = datums && kind === 'high' && isFinite(datums.ceiling) && Math.abs(value - datums.ceiling) <= 0.5;
            const nearBottom = datums && kind === 'low' && isFinite(datums.floor) && Math.abs(value - datums.floor) <= 0.5;

            let cls;
            if (nearTop || (pct !== null && pct >= 90)) cls = 'up2';
            else if (nearBottom || (pct !== null && pct <= 10)) cls = 'down2';
            else if (pct === null) cls = 'mid';
            else if (pct >= 67) cls = 'up1';
            else if (pct <= 33) cls = 'down1';
            else cls = 'mid';

            const labels = { up2: '↑↑', up1: '↑', mid: '≈', down1: '↓', down2: '↓↓' };
            return { label: labels[cls], cls };
        }

        // The 12-month baseline used to judge how high/low a tide is: every high
        // and low height from the past year, plus the station datums. Fetched at
        // most once per day (cached); the datums fetch degrades gracefully so an
        // outage still yields percentile-based verdicts. Returns null on failure.
        async function getTideBaseline(stationId) {
            const key = `tideBaseline:${stationId}:${getTodayDate()}`;
            const cached = cacheGet(key);
            if (cached) return cached;
            const [statsData, datums] = await Promise.all([
                fetchData(getTideStatsApiUrl(stationId)),
                getStationDatums(stationId).catch(() => null)
            ]);
            const highs = [], lows = [];
            ((statsData && statsData.predictions) || []).forEach(p => {
                const v = parseFloat(p.v);
                if (!isFinite(v)) return;
                if (p.type === 'H') highs.push(v);
                else if (p.type === 'L') lows.push(v);
            });
            if (!highs.length || !lows.length) return null;
            const baseline = { highs, lows, datums };
            cacheSet(key, baseline);
            return baseline;
        }

        // Eastern wall-clock stamp ("YYYY-MM-DD HH:MM") for a Date, matching the
        // format NOAA returns so the interpolated events flow through the same
        // parseEasternDateTime / formatTideTime / day-extreme code as raw ones.
        function toEasternStamp(date) {
            const d = date.toLocaleDateString('en-CA', { timeZone: TIME_ZONE });
            const t = date.toLocaleTimeString('en-GB', { timeZone: TIME_ZONE, hour: '2-digit', minute: '2-digit', hour12: false });
            return `${d} ${t}`;
        }

        // Estimate the target's high/low tides by interpolating between the two
        // anchor stations. Each east (Port Jefferson) event is matched to the
        // nearest same-type west (Northport) event within 3h, then both its time and
        // height are blended by weight w (0 = east, 1 = west). An east event with no
        // nearby west match is dropped rather than reported unblended.
        function estimateTides(eastPreds, westPreds, w) {
            const west = (westPreds || []).map(p => ({
                type: p.type, ms: parseEasternDateTime(p.t).getTime(), v: parseFloat(p.v)
            }));
            const out = [];
            (eastPreds || []).forEach(pe => {
                const me = parseEasternDateTime(pe.t).getTime();
                const ve = parseFloat(pe.v);
                if (!isFinite(me) || !isFinite(ve)) return;
                let best = null, bestDiff = Infinity;
                west.forEach(pw => {
                    if (pw.type !== pe.type) return;
                    const diff = Math.abs(pw.ms - me);
                    if (diff < bestDiff) { bestDiff = diff; best = pw; }
                });
                if (!best || bestDiff > 3 * 60 * 60 * 1000) return;
                const ms = me + w * (best.ms - me);
                const v = ve + w * (best.v - ve);
                out.push({ t: toEasternStamp(new Date(ms)), v: v.toFixed(3), type: pe.type });
            });
            out.sort((a, b) => parseEasternDateTime(a.t) - parseEasternDateTime(b.t));
            return { predictions: out };
        }

        // Blend two stations' datums for the target point. If only one side is
        // available it is used as-is; if neither is, returns null (the verdict then
        // falls back to percentile-only, which classifyTide already handles).
        function interpDatums(dE, dW, w) {
            if (!dE && !dW) return null;
            if (!dE) return dW;
            if (!dW) return dE;
            const blend = (a, b) => (isFinite(a) && isFinite(b)) ? a + w * (b - a) : (isFinite(a) ? a : b);
            return {
                avgHigh: blend(dE.avgHigh, dW.avgHigh),
                avgLow: blend(dE.avgLow, dW.avgLow),
                ceiling: blend(dE.ceiling, dW.ceiling),
                floor: blend(dE.floor, dW.floor)
            };
        }

        // Between two consecutive high/low events the tide is well approximated by
        // a half-cosine; f in [0,1] is the fraction of time elapsed from v0 to v1.
        function tideHeightBetween(v0, v1, f) {
            return v0 + (v1 - v0) * (1 - Math.cos(Math.PI * f)) / 2;
        }

        // A compact horizontal SVG of the tide curve around "now", drawn from the
        // estimated hi/lo predictions (same data as the list) so the shape and the
        // current-position dot line up with the numbers. Returns '' if there isn't
        // enough data to draw, so the caller can simply omit it.
        function buildTideWaveSvg(preds, now) {
            if (!preds || preds.length < 2) return '';
            const ev = preds.map(p => ({ ms: parseEasternDateTime(p.t).getTime(), v: parseFloat(p.v) }))
                            .filter(e => isFinite(e.ms) && isFinite(e.v));
            if (ev.length < 2) return '';
            const nowMs = now.getTime();

            // Window: the current cycle plus what's next (prev event + ~3 ahead).
            let idxNext = ev.findIndex(e => e.ms > nowMs);
            if (idxNext === -1) idxNext = ev.length;          // now after last event
            const start = Math.max(0, idxNext - 1);
            const end = Math.min(ev.length - 1, idxNext + 3);
            const win = ev.slice(start, end + 1);
            if (win.length < 2) return '';

            const W = 320, H = 46, padX = 4, padTop = 7, padBot = 7;
            const t0 = win[0].ms, t1 = win[win.length - 1].ms;
            const span = t1 - t0 || 1;
            const heights = win.map(e => e.v);
            let yMin = Math.min(...heights), yMax = Math.max(...heights);
            const pad = (yMax - yMin) * 0.08 || 0.5;
            yMin -= pad; yMax += pad;
            const xOf = ms => padX + ((ms - t0) / span) * (W - 2 * padX);
            const yOf = v => padTop + (1 - (v - yMin) / (yMax - yMin)) * (H - padTop - padBot);

            // Sample each segment with a half-cosine for a smooth tide curve.
            const pts = [];
            for (let i = 0; i < win.length - 1; i++) {
                const a = win[i], b = win[i + 1], steps = 16;
                for (let s = 0; s <= steps; s++) {
                    if (i > 0 && s === 0) continue;            // avoid duplicate join points
                    const f = s / steps;
                    pts.push([xOf(a.ms + f * (b.ms - a.ms)), yOf(tideHeightBetween(a.v, b.v, f))]);
                }
            }
            const line = pts.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
            const area = `${padX},${H - padBot} ${line} ${(W - padX)},${H - padBot}`;

            // Current position: clamp to the window edges if now sits outside it.
            const nowClamped = Math.min(Math.max(nowMs, t0), t1);
            let dotV;
            if (idxNext <= 0) dotV = win[0].v;
            else if (idxNext >= ev.length) dotV = win[win.length - 1].v;
            else {
                const a = ev[idxNext - 1], b = ev[idxNext];
                dotV = tideHeightBetween(a.v, b.v, (nowMs - a.ms) / (b.ms - a.ms || 1));
            }
            const dx = xOf(nowClamped), dy = yOf(dotV);

            return `
                <svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Current tide position">
                    <polygon points="${area}" fill="#96ACB7" fill-opacity="0.25" stroke="none"/>
                    <polyline points="${line}" fill="none" stroke="#05204A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <line x1="${dx.toFixed(1)}" y1="${padTop - 3}" x2="${dx.toFixed(1)}" y2="${H - padBot}" stroke="#05204A" stroke-width="0.75" stroke-opacity="0.4"/>
                    <circle cx="${dx.toFixed(1)}" cy="${dy.toFixed(1)}" r="4" fill="#05204A"/>
                </svg>
            `;
        }

        function enableFullScreen() {
            const elem = document.documentElement;
            (elem.requestFullscreen || elem.webkitRequestFullscreen).call(elem);
        }

        window.addEventListener('load', () => {
            const isIPhone = /iPhone/i.test(navigator.userAgent) && !window.MSStream;
            if (isIPhone) {
                if (!navigator.standalone) {
                    alert("To use this app in full-screen mode, please add it to your home screen.");
                } else {
                    enableFullScreen();
                }
            }
            updateCurrentDate();
            updateLandscapeTime();
        });

        async function fetchData(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            return response.json();
        }

        function updateCurrentDate() {
            document.getElementById('currentDate').textContent = new Date().toLocaleDateString(undefined, { timeZone: TIME_ZONE, weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }

        function updateLandscapeTime() {
            document.getElementById('landscapeTime').textContent = new Date().toLocaleTimeString([], { timeZone: TIME_ZONE, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
        }

        function formatTideTime(dateTimeString) {
            return parseEasternDateTime(dateTimeString).toLocaleTimeString([], { timeZone: TIME_ZONE, hour: '2-digit', minute: '2-digit', hour12: false });
        }

        function getTimeUntilNextTide(nextTide) {
            const now = new Date();
            const tideTime = parseEasternDateTime(nextTide.t);
            const timeDiff = tideTime - now;
            const hours = Math.floor(timeDiff / (1000 * 60 * 60));
            const minutes = Math.floor((timeDiff % (1000 * 60 * 60)) / (1000 * 60));
            return `${hours} hours ${minutes} minutes`;
        }

        function updateTideInfo(tideData, baseline) {
            const tideInfoElement = document.getElementById('tideInfo').querySelector('.data-box');
            const now = new Date();
            const tomorrow = getTomorrowDate();
            const preds = tideData.predictions;

            // The single highest high and lowest low of each calendar day, so those
            // rows can be flagged inline with how they compare to a typical year.
            const dayExtremes = {};
            preds.forEach(p => {
                const day = p.t.trim().split(/[ T]/)[0];
                const e = dayExtremes[day] || (dayExtremes[day] = {});
                const v = parseFloat(p.v);
                if (p.type === 'H') { if (!e.high || v > parseFloat(e.high.v)) e.high = p; }
                else if (p.type === 'L') { if (!e.low || v < parseFloat(e.low.v)) e.low = p; }
            });

            let futureTides = preds.filter(pred => parseEasternDateTime(pred.t) > now);
            let nextTide = futureTides[0];

            let tideHTML = `
                <div class="data-item">
                    <span class="data-label">${nextTide.type === 'H' ? 'High' : 'Low'} tide in:</span>
                    <span>${getTimeUntilNextTide(nextTide)}</span>
                </div>
            `;

            const wave = buildTideWaveSvg(preds, now);
            if (wave) tideHTML += `<div class="tide-wave">${wave}</div>`;

            futureTides.slice(0, 4).forEach((tide) => {
                const day = tide.t.trim().split(/[ T]/)[0];
                const isTomorrow = day === tomorrow;
                const e = dayExtremes[day] || {};

                // Flag a row only when it is its day's highest high or lowest low.
                let pill = '';
                if (baseline) {
                    if (tide.type === 'H' && e.high && e.high.t === tide.t) {
                        const verdict = classifyTide(parseFloat(tide.v), baseline.highs, 'high', baseline.datums);
                        pill = ` <span class="pill ${verdict.cls}">${verdict.label}</span>`;
                    } else if (tide.type === 'L' && e.low && e.low.t === tide.t) {
                        const verdict = classifyTide(parseFloat(tide.v), baseline.lows, 'low', baseline.datums);
                        pill = ` <span class="pill ${verdict.cls}">${verdict.label}</span>`;
                    }
                }

                tideHTML += `
                    <div class="data-item">
                        <span class="data-label">${tide.type === 'H' ? 'High' : 'Low'}${isTomorrow ? '*' : ''}</span>
                        <span>(${parseFloat(tide.v).toFixed(2)}) ${formatTideTime(tide.t)}${pill}</span>
                    </div>
                `;
            });

            tideHTML += `
                <div class="data-item note">
                    <span>heights &amp; times estimated for this location${preds.some(p => p.t.trim().split(/[ T]/)[0] === tomorrow) ? ' &middot; * = tomorrow' : ''}</span>
                </div>
            `;

            tideInfoElement.innerHTML = tideHTML;
            document.getElementById('tideInfo').style.display = 'block';
        }

        function updateWaterTempInfo(tempData, sourceName) {
            const section = document.getElementById('waterTempInfo');
            const reading = tempData && tempData.data && tempData.data[0];
            const v = reading ? parseFloat(reading.v) : NaN;
            if (!isFinite(v)) { section.style.display = 'none'; return; }
            section.querySelector('.data-box').innerHTML = `
                <div class="data-item">
                    <span class="data-label">Water temp:</span>
                    <span>${v.toFixed(1)}&deg;F</span>
                </div>
                <div class="data-item note">
                    <span>source: ${sourceName}</span>
                </div>
            `;
            section.style.display = 'block';
        }

        function updateSunMoonInfo(sunMoonData) {
            const sunInfoElement = document.getElementById('sunInfo').querySelector('.data-box');
            const moonInfoElement = document.getElementById('moonInfo').querySelector('.data-box');

            const sunLabels = {
                'Begin Civil Twilight': 'First Light',
                'Upper Transit': 'Midday',
                'End Civil Twilight': 'Last Light'
            };

            sunInfoElement.innerHTML = sunMoonData.sundata.map(item => `
                <div class="data-item">
                    <span class="data-label">${sunLabels[item.phen] || item.phen}:</span>
                    <span>${item.time}</span>
                </div>
            `).join('');

            moonInfoElement.innerHTML = `
                <div class="data-item">
                    <span class="data-label">Phase:</span>
                    <span>${sunMoonData.curphase}</span>
                </div>
                <div class="data-item">
                    <span class="data-label">Illumination:</span>
                    <span>${sunMoonData.fracillum}</span>
                </div>
                ${sunMoonData.moondata.map(item => `
                    <div class="data-item">
                        <span class="data-label">${item.phen === 'Upper Transit' ? 'Zenith' : item.phen}:</span>
                        <span>${item.time}</span>
                    </div>
                `).join('')}
            `;

            document.getElementById('sunInfo').style.display = 'block';
            document.getElementById('moonInfo').style.display = 'block';
        }

        async function updateAllInfo() {
            const loadingElement = document.getElementById('loading');
            const errorElement = document.getElementById('error');

            try {
                loadingElement.style.display = 'block';
                errorElement.style.display = 'none';

                const [sunMoonData, eastTide, westTide, tempData, pjBaseline, npDatums] = await Promise.all([
                    fetchData(getSunMoonApiUrl()).then(data => data.properties.data),
                    fetchData(getTideApiUrl(EAST.id)),
                    fetchData(getTideApiUrl(WEST.id)),
                    fetchData(getWaterTempUrl(TEMP_STATION.id)).catch(() => null),
                    getTideBaseline(EAST.id).catch(() => null),
                    getStationDatums(WEST.id).catch(() => null)
                ]);

                const estimated = estimateTides(eastTide.predictions, westTide.predictions, W);
                const baseline = pjBaseline
                    ? { highs: pjBaseline.highs, lows: pjBaseline.lows, datums: interpDatums(pjBaseline.datums, npDatums, W) }
                    : null;

                updateTideInfo(estimated, baseline);
                updateWaterTempInfo(tempData, TEMP_STATION.name);
                updateSunMoonInfo(sunMoonData);
                updateCurrentDate();
                updateLandscapeTime();

                loadingElement.style.display = 'none';
            } catch (error) {
                loadingElement.style.display = 'none';
                errorElement.style.display = 'block';
                errorElement.textContent = 'Failed to load data. Please try again later.';
            }
        }

        updateAllInfo();
        setInterval(updateAllInfo, 60000);
        setInterval(updateLandscapeTime, 1000);
    </script>
</body>
</html>
