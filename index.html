<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Port Jefferson Data</title>
    <style>
        body {
            font-family: Courier, monospace;
            background-color: #96ACB7;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #05204A;
        }
        .app-container {
            background-color: #E8EEF2;
            border-radius: 40px;
            box-shadow: 0 0 20px rgba(5, 32, 74, 0.2);
            width: 100%;
            max-width: 375px;
            height: 100vh;
            max-height: 812px;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .location { font-size: 24px; font-weight: bold; margin-top: env(safe-area-inset-top); }
        .current-date { font-size: 18px; margin-bottom: 20px; }
        .data-section { width: 100%; margin-bottom: 20px; }
        .data-section h2 { font-size: 18px; margin: 0 0 10px; }
        .data-box {
            background-color: #FFFFFF;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            width: 100%;
            box-sizing: border-box;
        }
        .data-item { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .data-label { font-weight: bold; }
        .tide-compare-head { margin-top: 10px; padding-top: 10px; border-top: 1px solid #96ACB7; }
        .tide-compare { align-items: center; }
        .tide-time { opacity: 0.7; }
        .pill { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 12px; font-weight: bold; white-space: nowrap; }
        .pill.up2 { background: #f2c9c0; color: #7a1f0c; }
        .pill.up1 { background: #f7e0d2; color: #8a4a2c; }
        .pill.mid { background: #d8e0e6; color: #3a4a57; }
        .pill.down1 { background: #dbe6f4; color: #2c4a7a; }
        .pill.down2 { background: #c0d6f2; color: #0c3a7a; }
        #loading, #error { text-align: center; font-size: 18px; }
        .landscape-time {
            display: none;
            font-size: 48px;
            font-weight: bold;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        @media (orientation: landscape) {
            body { background-color: #05204A; }
            .app-container {
                background-color: transparent;
                box-shadow: none;
            }
            .app-container > *:not(.landscape-time) { display: none; }
            .landscape-time { display: block; color: #E8EEF2; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="location">Port Jefferson</div>
        <div class="current-date" id="currentDate"></div>
        <div id="loading">Loading data...</div>
        <div id="error" style="display: none;"></div>
        <div id="tideInfo" class="data-section" style="display: none;">
            <h2>Tide Information</h2>
            <div class="data-box"></div>
        </div>
        <div id="sunInfo" class="data-section" style="display: none;">
            <h2>Sun Information</h2>
            <div class="data-box"></div>
        </div>
        <div id="moonInfo" class="data-section" style="display: none;">
            <h2>Moon Information</h2>
            <div class="data-box"></div>
        </div>
        <div class="landscape-time" id="landscapeTime"></div>
    </div>

    <script>
        // Port Jefferson is in the US Eastern time zone. Anchoring everything to
        // this zone keeps the app accurate regardless of where it is viewed and
        // automatically follows the EST/EDT daylight-savings switch.
        const TIME_ZONE = 'America/New_York';

        // Eastern Time's current UTC offset in whole hours (-5 during EST, -4
        // during EDT). Derived from the date so daylight savings is handled for us.
        function getEasternUtcOffset(date = new Date()) {
            const utcDate = new Date(date.toLocaleString('en-US', { timeZone: 'UTC' }));
            const easternDate = new Date(date.toLocaleString('en-US', { timeZone: TIME_ZONE }));
            return Math.round((easternDate - utcDate) / (1000 * 60 * 60));
        }

        // Calendar date (YYYY-MM-DD) as it is in Eastern Time, not UTC. Using UTC
        // here would roll over to "tomorrow" during the evening hours.
        function getEasternDateString(date = new Date()) {
            return date.toLocaleDateString('en-CA', { timeZone: TIME_ZONE });
        }

        // NOAA returns tide times as Eastern wall-clock strings ("YYYY-MM-DD HH:MM")
        // with no zone marker. Attach the correct Eastern offset so they parse to the
        // right instant even when the viewing device is in another time zone.
        function parseEasternDateTime(dateTimeString) {
            const [datePart, timePart] = dateTimeString.trim().split(/[ T]/);
            const offset = getEasternUtcOffset(new Date(`${datePart}T12:00:00Z`));
            const sign = offset >= 0 ? '+' : '-';
            const pad = String(Math.abs(offset)).padStart(2, '0');
            return new Date(`${datePart}T${timePart}:00${sign}${pad}:00`);
        }

        function getTodayDate() {
            return getEasternDateString();
        }

        function getTomorrowDate() {
            return getEasternDateString(new Date(Date.now() + 24 * 60 * 60 * 1000));
        }

        function getSunMoonApiUrl() {
            const tz = getEasternUtcOffset();
            return `https://aa.usno.navy.mil/api/rstt/oneday?date=${getTodayDate()}&coords=40.9465,-73.0693&tz=${tz}&dst=false`;
        }

        function getTideApiUrl() {
            const beginDate = getTodayDate().replace(/-/g, '');
            const endDate = getTomorrowDate().replace(/-/g, '');
            return `https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?product=predictions&application=NOS.COOPS.TAC.WL&begin_date=${beginDate}&end_date=${endDate}&datum=MLLW&station=8514560&time_zone=lst_ldt&units=english&interval=hilo&format=json`;
        }

        // --- Today vs. typical comparison ------------------------------------

        function getDatumsApiUrl() {
            return 'https://api.tidesandcurrents.noaa.gov/mdapi/prod/webapi/stations/8514560/datums.json';
        }

        // A full year of high/low predictions, ending today, for the 12-month
        // percentile. Same URL shape as getTideApiUrl, just a wider date range.
        function getTideStatsApiUrl() {
            const beginDate = getEasternDateString(new Date(Date.now() - 365 * 24 * 60 * 60 * 1000)).replace(/-/g, '');
            const endDate = getTodayDate().replace(/-/g, '');
            return `https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?product=predictions&application=NOS.COOPS.TAC.WL&begin_date=${beginDate}&end_date=${endDate}&datum=MLLW&station=8514560&time_zone=lst_ldt&units=english&interval=hilo&format=json`;
        }

        // Small persistent cache (localStorage) with an in-memory fallback for
        // browsers that block storage, e.g. private mode. Values use JSON.
        const memoryCache = {};
        function cacheGet(key) {
            try {
                const raw = localStorage.getItem(key);
                if (raw !== null) return JSON.parse(raw);
            } catch (e) { /* storage unavailable */ }
            return key in memoryCache ? memoryCache[key] : null;
        }
        function cacheSet(key, value) {
            memoryCache[key] = value;
            try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* ignore */ }
        }

        // NOAA's published tidal datums (long-term averages and astronomical
        // extremes) only change once per ~19-year epoch, so they are cached for a
        // long time. They are reported on the station datum; we convert to the MLLW
        // reference the predictions use so they line up with predicted heights.
        async function getStationDatums() {
            const key = 'tideDatums:8514560';
            const cached = cacheGet(key);
            if (cached && (Date.now() - cached.fetchedAt) < 30 * 24 * 60 * 60 * 1000) {
                return cached.datums;
            }
            const data = await fetchData(getDatumsApiUrl());
            const byName = {};
            (data.datums || []).forEach(d => { byName[d.name] = parseFloat(d.value); });
            const mllw = byName.MLLW;
            if (!isFinite(mllw)) throw new Error('Datums missing MLLW');
            const toMllw = stnd => parseFloat(stnd) - mllw;
            const datums = {
                avgHigh: toMllw(byName.MHHW),   // mean higher-high water = average high tide
                avgLow: 0,                       // MLLW is the prediction baseline (average low tide)
                ceiling: toMllw(data.HAT),       // highest astronomical tide
                floor: toMllw(data.LAT)          // lowest astronomical tide
            };
            cacheSet(key, { fetchedAt: Date.now(), datums });
            return datums;
        }

        // Percentage of values in arr strictly less than value (0-100), or null.
        function percentileOf(value, arr) {
            if (!arr.length) return null;
            const below = arr.reduce((n, v) => n + (v < value ? 1 : 0), 0);
            return Math.round((below / arr.length) * 100);
        }

        // Classifies a tide height against the past year's distribution of that
        // tide type (and the astronomical extreme from the datums) into a verdict
        // describing how high/low the water is. The same scale is used for the
        // daily high and the daily low — blue = lower water, red = higher water.
        function classifyTide(value, arr, kind, datums) {
            const pct = percentileOf(value, arr);
            const nearTop = datums && kind === 'high' && isFinite(datums.ceiling) && Math.abs(value - datums.ceiling) <= 0.5;
            const nearBottom = datums && kind === 'low' && isFinite(datums.floor) && Math.abs(value - datums.floor) <= 0.5;

            if (nearTop || (pct !== null && pct >= 90)) return { label: '↑ very high', cls: 'up2' };
            if (nearBottom || (pct !== null && pct <= 10)) return { label: '↓ very low', cls: 'down2' };
            if (pct === null) return { label: '≈ typical', cls: 'mid' };
            if (pct >= 67) return { label: 'above avg', cls: 'up1' };
            if (pct <= 33) return { label: 'below avg', cls: 'down1' };
            return { label: '≈ typical', cls: 'mid' };
        }

        // Builds today's daily high and low — each with its clock time and a verdict
        // — from a year of hi/lo predictions plus the station datums. Returns null
        // when today's tides can't be determined.
        function computeTideComparison(statsData, datums) {
            const preds = (statsData && statsData.predictions) || [];
            const today = getTodayDate();
            const highs = [], lows = [], todayHighs = [], todayLows = [];
            preds.forEach(p => {
                const v = parseFloat(p.v);
                if (!isFinite(v)) return;
                const isToday = p.t.trim().split(/[ T]/)[0] === today;
                if (p.type === 'H') { highs.push(v); if (isToday) todayHighs.push({ v, t: p.t }); }
                else if (p.type === 'L') { lows.push(v); if (isToday) todayLows.push({ v, t: p.t }); }
            });
            if (!todayHighs.length || !todayLows.length) return null;

            const hi = todayHighs.reduce((a, b) => (b.v > a.v ? b : a));
            const lo = todayLows.reduce((a, b) => (b.v < a.v ? b : a));
            return {
                high: { value: hi.v, time: formatTideTime(hi.t), verdict: classifyTide(hi.v, highs, 'high', datums) },
                low:  { value: lo.v, time: formatTideTime(lo.t), verdict: classifyTide(lo.v, lows, 'low', datums) }
            };
        }

        // Today's comparison, fetching the 12-month predictions and station datums
        // at most once per day (cached). The datums fetch degrades gracefully so a
        // datums outage still yields the percentile-only wording.
        async function getTodayTideComparison() {
            const key = `tideStats:v2:8514560:${getTodayDate()}`;
            const cached = cacheGet(key);
            if (cached) return cached;
            const [statsData, datums] = await Promise.all([
                fetchData(getTideStatsApiUrl()),
                getStationDatums().catch(() => null)
            ]);
            const result = computeTideComparison(statsData, datums);
            if (result) cacheSet(key, result);
            return result;
        }

        function enableFullScreen() {
            const elem = document.documentElement;
            (elem.requestFullscreen || elem.webkitRequestFullscreen).call(elem);
        }

        window.addEventListener('load', () => {
            const isIPhone = /iPhone/i.test(navigator.userAgent) && !window.MSStream;
            if (isIPhone) {
                if (!navigator.standalone) {
                    alert("To use this app in full-screen mode, please add it to your home screen.");
                } else {
                    enableFullScreen();
                }
            }
            updateCurrentDate();
            updateLandscapeTime();
        });

        async function fetchData(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            return response.json();
        }

        function updateCurrentDate() {
            document.getElementById('currentDate').textContent = new Date().toLocaleDateString(undefined, { timeZone: TIME_ZONE, weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }

        function updateLandscapeTime() {
            document.getElementById('landscapeTime').textContent = new Date().toLocaleTimeString([], { timeZone: TIME_ZONE, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
        }

        function formatTideTime(dateTimeString) {
            return parseEasternDateTime(dateTimeString).toLocaleTimeString([], { timeZone: TIME_ZONE, hour: '2-digit', minute: '2-digit', hour12: false });
        }

        function getTimeUntilNextTide(nextTide) {
            const now = new Date();
            const tideTime = parseEasternDateTime(nextTide.t);
            const timeDiff = tideTime - now;
            const hours = Math.floor(timeDiff / (1000 * 60 * 60));
            const minutes = Math.floor((timeDiff % (1000 * 60 * 60)) / (1000 * 60));
            return `${hours} hours ${minutes} minutes`;
        }

        function updateTideInfo(tideData, comparison) {
            const tideInfoElement = document.getElementById('tideInfo').querySelector('.data-box');
            const now = new Date();
            const tomorrow = getTomorrowDate();

            let futureTides = tideData.predictions.filter(pred => parseEasternDateTime(pred.t) > now);
            let nextTide = futureTides[0];
            
            let tideHTML = `
                <div class="data-item">
                    <span class="data-label">${nextTide.type === 'H' ? 'High' : 'Low'} tide in:</span>
                    <span>${getTimeUntilNextTide(nextTide)}</span>
                </div>
            `;
            
            futureTides.slice(0, 4).forEach((tide, index) => {
                const isTomorrow = tide.t.trim().split(/[ T]/)[0] === tomorrow;
                tideHTML += `
                    <div class="data-item">
                        <span class="data-label">${tide.type === 'H' ? 'High' : 'Low'}${isTomorrow ? '*' : ''}</span>
                        <span>(${parseFloat(tide.v).toFixed(2)}) ${formatTideTime(tide.t)}</span>
                    </div>
                `;
            });

            if (comparison) {
                const compareRow = (label, c) => `
                    <div class="data-item tide-compare">
                        <span>${label} ${c.value.toFixed(2)} ft <span class="tide-time">· ${c.time}</span></span>
                        <span class="pill ${c.verdict.cls}">${c.verdict.label}</span>
                    </div>
                `;
                tideHTML += `
                    <div class="data-item tide-compare-head">
                        <span class="data-label">Today vs. typical</span>
                    </div>
                    ${compareRow('High', comparison.high)}
                    ${compareRow('Low', comparison.low)}
                `;
            }

            tideInfoElement.innerHTML = tideHTML;
            document.getElementById('tideInfo').style.display = 'block';
        }

        function updateSunMoonInfo(sunMoonData) {
            const sunInfoElement = document.getElementById('sunInfo').querySelector('.data-box');
            const moonInfoElement = document.getElementById('moonInfo').querySelector('.data-box');

            const sunLabels = {
                'Begin Civil Twilight': 'First Light',
                'Upper Transit': 'Midday',
                'End Civil Twilight': 'Last Light'
            };

            sunInfoElement.innerHTML = sunMoonData.sundata.map(item => `
                <div class="data-item">
                    <span class="data-label">${sunLabels[item.phen] || item.phen}:</span>
                    <span>${item.time}</span>
                </div>
            `).join('');

            moonInfoElement.innerHTML = `
                <div class="data-item">
                    <span class="data-label">Phase:</span>
                    <span>${sunMoonData.curphase}</span>
                </div>
                <div class="data-item">
                    <span class="data-label">Illumination:</span>
                    <span>${sunMoonData.fracillum}</span>
                </div>
                ${sunMoonData.moondata.map(item => `
                    <div class="data-item">
                        <span class="data-label">${item.phen === 'Upper Transit' ? 'Zenith' : item.phen}:</span>
                        <span>${item.time}</span>
                    </div>
                `).join('')}
            `;

            document.getElementById('sunInfo').style.display = 'block';
            document.getElementById('moonInfo').style.display = 'block';
        }

        async function updateAllInfo() {
            const loadingElement = document.getElementById('loading');
            const errorElement = document.getElementById('error');

            try {
                loadingElement.style.display = 'block';
                errorElement.style.display = 'none';

                const [sunMoonData, tideData, comparison] = await Promise.all([
                    fetchData(getSunMoonApiUrl()).then(data => data.properties.data),
                    fetchData(getTideApiUrl()),
                    getTodayTideComparison().catch(() => null)
                ]);

                updateTideInfo(tideData, comparison);
                updateSunMoonInfo(sunMoonData);
                updateCurrentDate();
                updateLandscapeTime();

                loadingElement.style.display = 'none';
            } catch (error) {
                loadingElement.style.display = 'none';
                errorElement.style.display = 'block';
                errorElement.textContent = 'Failed to load data. Please try again later.';
            }
        }

        updateAllInfo();
        setInterval(updateAllInfo, 60000);
        setInterval(updateLandscapeTime, 1000);
    </script>
</body>
</html>
